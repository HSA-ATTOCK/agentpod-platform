name: Deploy to AWS

# Manual only: Actions → "Deploy to AWS" → Run workflow.
# One-time setup (see docs/DEPLOYMENT_GUIDE.md):
#   - repository variables: AWS_REGION, ECR_REPOSITORY_URL, ECS_CLUSTER, APP_URL,
#     NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   - repository secret:   AWS_DEPLOY_ROLE_ARN (an IAM role GitHub can assume through OIDC;
#     allowed to push to ECR and update the ECS service). No AWS keys are stored in GitHub.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${{ vars.ECR_REPOSITORY_URL }}"

      - name: Build and push the image
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.APP_URL }}" \
            -t "${{ vars.ECR_REPOSITORY_URL }}:$TAG" -t "${{ vars.ECR_REPOSITORY_URL }}:latest" .
          docker push --all-tags "${{ vars.ECR_REPOSITORY_URL }}"

      - name: Roll out (rolls back automatically if the new version is unhealthy)
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service web --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services web

      - name: Check health
        run: curl -fsS "${{ vars.APP_URL }}/api/health"
